services:
  presto:
    image: prestodb/presto:0.297
    container_name: wayang-presto
    ports:
      - "8080:8080"
    volumes:
      - ./presto/catalog:/opt/presto-server/etc/catalog:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
