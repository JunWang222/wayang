# Connection (override per deployment in wayang.properties)
# wayang.presto.jdbc.url      = jdbc:presto://localhost:8080/memory/sales
# wayang.presto.jdbc.user     = admin
# wayang.presto.jdbc.password =
wayang.presto.jdbc.driverName = com.facebook.presto.jdbc.PrestoDriver

wayang.presto.cpu.mhz = 2700
wayang.presto.cores = 4
wayang.presto.costs.fix = 0.0
wayang.presto.costs.per-ms = 1.0

wayang.presto.tablesource.load.template = {\
  "type":"mathex", "in":0, "out":1,\
  "cpu":"?*out0 + ?",\
  "ram":"0",\
  "p":0.9\
}
wayang.presto.tablesource.load = {\
  "in":0, "out":1,\
  "cpu":"${10*out0 + 800000}",\
  "ram":"0",\
  "p":0.9\
}

wayang.presto.filter.load.template = {\
  "type":"mathex", "in":1, "out":1,\
  "cpu":"?*in0 + ?",\
  "ram":"0",\
  "p":0.9\
}
wayang.presto.filter.load = {\
  "in":1, "out":1,\
  "cpu":"${10*in0 + 800000}",\
  "ram":"0",\
  "p":0.9\
}

wayang.presto.projection.load.template = {\
  "type":"mathex", "in":1, "out":1,\
  "cpu":"?*in0 + ?",\
  "ram":"0",\
  "p":0.9\
}
wayang.presto.projection.load = {\
  "in":1, "out":1,\
  "cpu":"${10*in0 + 800000}",\
  "ram":"0",\
  "p":0.9\
}

wayang.presto.sqltostream.load.query.template = {\
  "type":"mathex", "in":1, "out":1,\
  "cpu":"?*out0 + ?"\
}
wayang.presto.sqltostream.load.query = {\
  "in":1, "out":1,\
  "cpu":"${10*out0 + 800000}",\
  "ram":"0",\
  "p":0.9\
}
wayang.presto.sqltostream.load.output.template = {\
  "type":"mathex", "in":1, "out":1,\
  "cpu":"?*out0"\
}
wayang.presto.sqltostream.load.output = {\
  "in":1, "out":1,\
  "cpu":"${10*out0}",\
  "ram":"0",\
  "p":0.9\
}
