apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spark-event-logs
  namespace: wayang-profiling
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: spark-event-log-reader
  namespace: wayang-profiling
  labels:
    app.kubernetes.io/name: spark-event-log-reader
spec:
  restartPolicy: Always
  containers:
    - name: reader
      image: busybox:1.37
      command: ["sh", "-c", "trap : TERM INT; sleep infinity & wait"]
      volumeMounts:
        - name: eventlog
          mountPath: /var/spark-events
          readOnly: true
  volumes:
    - name: eventlog
      persistentVolumeClaim:
        claimName: spark-event-logs
