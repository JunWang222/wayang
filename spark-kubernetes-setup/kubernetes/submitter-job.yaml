apiVersion: batch/v1
kind: Job
metadata:
  name: spark-join-submit
  namespace: wayang-profiling
  labels:
    app.kubernetes.io/name: spark-join-smoke
    app.kubernetes.io/component: submitter
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spark-join-smoke
        app.kubernetes.io/component: submitter
    spec:
      serviceAccountName: spark
      restartPolicy: Never
      containers:
        - name: spark-submit
          image: wayang/spark-kubernetes-smoke:3.5.7
          imagePullPolicy: Never
          command: ["/opt/spark/bin/spark-submit"]
          args:
            - --master
            - k8s://https://kubernetes.default.svc:443
            - --deploy-mode
            - cluster
            - --name
            - spark-join-smoke
            - --class
            - org.apache.wayang.kubernetes.JoinSmokeTest
            - --conf
            - spark.kubernetes.namespace=wayang-profiling
            - --conf
            - spark.kubernetes.authenticate.driver.serviceAccountName=spark
            - --conf
            - spark.kubernetes.container.image=wayang/spark-kubernetes-smoke:3.5.7
            - --conf
            - spark.kubernetes.container.image.pullPolicy=Never
            - --conf
            - spark.executor.instances=3
            - --conf
            - spark.executor.cores=1
            - --conf
            - spark.executor.memory=512m
            - --conf
            - spark.executor.memoryOverhead=256m
            - --conf
            - spark.driver.cores=1
            - --conf
            - spark.driver.memory=512m
            - --conf
            - spark.driver.memoryOverhead=256m
            - --conf
            - spark.default.parallelism=12
            - --conf
            - spark.eventLog.enabled=true
            - --conf
            - spark.eventLog.dir=file:///tmp/spark-events
            - --conf
            - spark.kubernetes.driver.volumes.persistentVolumeClaim.eventlog.options.claimName=spark-event-logs
            - --conf
            - spark.kubernetes.driver.volumes.persistentVolumeClaim.eventlog.mount.path=/tmp/spark-events
            - --conf
            - spark.kubernetes.driver.volumes.persistentVolumeClaim.eventlog.mount.readOnly=false
            - local:///opt/spark/app/wayang-spark-kubernetes-smoke.jar
            - "200000"
            - "150000"
            - "50000"
            - "12"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
