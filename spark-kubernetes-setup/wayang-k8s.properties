spark.master = k8s://https://kubernetes.default.svc:443
spark.app.name = wayang-profiler-join
spark.executor.instances = 3
spark.executor.cores = 1
spark.executor.memory = 512m
spark.eventLog.enabled = true
spark.eventLog.dir = file:///tmp/spark-events
spark.ui.showConsoleProgress = false

wayang.spark.machines = 3
wayang.spark.cores-per-machine = 1
wayang.spark.partitions = 12

wayang.profiler.datagen.location = worker
wayang.profiler.execute.padding = 0
wayang.profiler.ganglia.enabled = false
wayang.profiler.spark.warmup.enabled = false
