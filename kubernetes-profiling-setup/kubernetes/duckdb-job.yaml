apiVersion: batch/v1
kind: Job
metadata:
  name: duckdb-smoke
  namespace: wayang-profiling
  labels:
    app.kubernetes.io/name: wayang-duckdb-smoke
    app.kubernetes.io/component: profiling-validation
spec:
  suspend: true
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wayang-duckdb-smoke
        app.kubernetes.io/component: profiling-validation
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 0
      containers:
        - name: duckdb
          image: wayang/duckdb-kubernetes-smoke:1.5.5.1
          imagePullPolicy: IfNotPresent
          env:
            - name: DUCKDB_DATABASE_PATH
              value: /var/wayang/duckdb/wayang.duckdb
            - name: ROW_COUNT
              value: "10000"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: profile-data
              mountPath: /var/wayang
      volumes:
        - name: profile-data
          persistentVolumeClaim:
            claimName: platform-profile-data
